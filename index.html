<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sora产品助手</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="language-selector">
        <select id="languageSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="settings-section">
                <div class="settings-title" data-i18n="knowledge-base-settings">数据库设置</div>
                <div class="settings-item">
                    <label class="settings-label" data-i18n="select-knowledge-base">选择数据库:</label>
                    <select id="datasetSelect" disabled>
                        <option value="" data-i18n="loading">加载中...</option>
                    </select>
                    <button id="refreshDatasets" class="refresh-button" data-i18n="refresh-knowledge-base">刷新数据库</button>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-title" data-i18n="assistant-settings">助手设置</div>
                <div class="settings-item">
                    <label class="settings-label" data-i18n="select-assistant">选择助手:</label>
                    <select id="assistantSelect">
                        <option value="" data-i18n="loading">加载中...</option>
                    </select>
                    <button id="refreshAssistants" class="refresh-button" data-i18n="refresh-assistant">刷新助手</button>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-title" data-i18n="session-id-management">会话ID管理</div>
                <div class="settings-item">
                    <label class="settings-label" data-i18n="enter-session-id">输入会话ID:</label>
                    <input type="text" id="sessionIdInput" data-i18n-placeholder="session-id-placeholder" placeholder="输入会话ID...">
                    <button id="loadSessionBtn" class="refresh-button" data-i18n="load-session">载入会话</button>
                    <div id="currentSessionInfo" class="session-info">
                        <strong data-i18n="current-session-id">当前会话ID:</strong> <span id="currentSessionId"></span>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-title" data-i18n="display-options">显示选项</div>
                <div class="settings-item">
                    <div class="checkbox-container">
                        <input type="checkbox" id="showReferences">
                        <label for="showReferences" data-i18n="show-references">显示参考资料</label>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="showKeywords">
                        <label for="showKeywords" data-i18n="show-keywords">显示关键词分析</label>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-title" data-i18n="session-management">会话管理</div>
                <div class="settings-item">
                    <label class="settings-label" data-i18n="cleanup-idle-sessions">清理闲置会话:</label>
                    <select id="idleTimeSelect">
                        <option value="30" data-i18n="30-minutes-ago">30分钟前</option>
                        <option value="60" data-i18n="1-hour-ago">1小时前</option>
                        <option value="180" data-i18n="3-hours-ago">3小时前</option>
                        <option value="1440" data-i18n="1-day-ago">1天前</option>
                        <option value="4320" data-i18n="3-days-ago">3天前</option>
                        <option value="10080" data-i18n="7-days-ago" selected>7天前</option>
                        <option value="20160" data-i18n="14-days-ago">14天前</option>
                        <option value="43200" data-i18n="30-days-ago">30天前</option>
                    </select>
                    <button id="cleanupSessions" class="cleanup-button" data-i18n="cleanup-idle-sessions-btn">清理闲置会话</button>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="header">
                <h1 data-i18n="title">Sora产品助手</h1>
            </div>
            
            <div class="chat-area" id="chatArea">
                <div class="message info" data-i18n="welcome-message">
                    请选择一个数据库和助手开始对话。如果没有可用的助手，请联系管理员。
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="userInput" data-i18n-placeholder="input-placeholder" placeholder="输入您的消息..." autocomplete="off" disabled>
                <button id="sendButton" data-i18n="send" disabled>发送</button>
            </div>
        </div>
    </div>

    <!-- 加载应用JavaScript -->
    <script src="app.js"></script>
</body>
</html>
